name: Tourism Project Pipeline

on:
  push:
    branches:
      - main            # Automatically triggers on push to the main branch
  workflow_dispatch:     # lets you click "Run workflow" in the Actions tab

permissions:
  contents: write

jobs:
 # JOB1: Register Dataset
  register-dataset:
    name: Register Dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt
      - name: Install Dependencies
        run: python -m pip install -r tourism_project/requirements.txt
      - name: Register Dataset
        run: python tourism_project/model_building/data_register.py
      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv
          if-no-files-found: error

# JOB2: Data Preparation
  data-preparation:
    name: Data Preparation
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt
      - name: Install Dependencies
        run: python -m pip install -r tourism_project/requirements.txt
      - name: Download Registered Dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data
      - name: Run Data Preparation
        run: python tourism_project/model_building/prep.py
      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv
          if-no-files-found: error
      - name: Upload Data Reports
        uses: actions/upload-artifact@v4
        with:
          name: data-reports
          path: tourism_project/reports/
          if-no-files-found: error
    

  # ---------- JOB 3: Model Training + MLflow Tracking ----------
  model-training:
    name: Model Training
    needs: data-preparation          # waits for Job 2 to finish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Download train/test splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits          # brings Xtrain/Xtest/ytrain/ytest from Job 2
      - name: Start MLflow tracking server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 &   # Run MLflow UI in the background
          sleep 5                                        # give the server a moment to start
      - name: Train model with MLflow tracking
        run: python tourism_project/model_building/train.py
      - name: Commit trained model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/model.joblib tourism_project/deployment/schema.json tourism_project/reports
          git commit -m "Add trained model [skip ci]" || echo "No changes to commit"
          git push

